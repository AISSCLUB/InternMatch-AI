name: InternMatch CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENAI_API_KEY: sk-ci-test-placeholder
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            requirements-dev.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install backend runtime & dev requirements
        run: pip install -r requirements-dev.txt

      - name: Run Ruff linter
        run: python -m ruff check backend/app worker tests --output-format=concise

      - name: Run Pytest test suite
        run: python -m pytest -q

  backend-container:
    name: Backend Containers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Prepare CI environment file
        run: cp .env.example .env

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Build backend and worker containers
        run: docker compose build backend worker

  mobile-contract:
    name: Mobile Contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npx tsc --noEmit

  landing-build:
    name: Landing Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/landing
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --ignore-scripts=false
          fi

      - name: Build Next.js application
        run: |
          if [ -d "app" ] || [ -d "pages" ] || [ -d "src/app" ] || [ -d "src/pages" ]; then
            npm run build
          else
            echo "Landing app is currently a scaffold; no app/ or pages/ directory exists yet."
            echo "Skipping Next.js build until the frontend application is present."
          fi

  postgres-matching-runtime:
    name: Postgres Matching Runtime
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17-bookworm
        env:
          POSTGRES_DB: internmatch
          POSTGRES_USER: internmatch
          POSTGRES_PASSWORD: internmatch_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U internmatch -d internmatch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            requirements-dev.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install backend runtime & dev requirements
        run: pip install -r requirements-dev.txt

      - name: Initialize PostgreSQL database schema
        env:
          PGPASSWORD: internmatch_dev_password
        run: |
          psql -h localhost -U internmatch -d internmatch -c "CREATE SCHEMA IF NOT EXISTS auth; CREATE TABLE IF NOT EXISTS auth.users (id UUID PRIMARY KEY);"
          psql -h localhost -U internmatch -d internmatch -f database/migrations/001_initial_schema.sql

      - name: Run PostgreSQL matching runtime integration test suite
        env:
          TEST_POSTGRES_DATABASE_URL: postgresql://internmatch:internmatch_dev_password@localhost:5432/internmatch
        run: |
          python -m pytest tests/test_postgres_matching_runtime.py -q

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs:
      - backend-quality
      - backend-container
      - mobile-contract
      - landing-build
      - postgres-matching-runtime
    if: always()
    steps:
      - name: Evaluate CI Gate Status
        run: |
          if [ "${{ needs.backend-quality.result }}" != "success" ] || \
             [ "${{ needs.backend-container.result }}" != "success" ] || \
             [ "${{ needs.mobile-contract.result }}" != "success" ] || \
             [ "${{ needs.landing-build.result }}" != "success" ] || \
             [ "${{ needs.postgres-matching-runtime.result }}" != "success" ]; then
            echo "One or more required CI checks failed or did not run successfully."
            echo "backend-quality: ${{ needs.backend-quality.result }}"
            echo "backend-container: ${{ needs.backend-container.result }}"
            echo "mobile-contract: ${{ needs.mobile-contract.result }}"
            echo "landing-build: ${{ needs.landing-build.result }}"
            echo "postgres-matching-runtime: ${{ needs.postgres-matching-runtime.result }}"
            exit 1
          fi
          echo "All required CI jobs succeeded."
